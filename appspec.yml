version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/laravel
hooks:
  AfterInstall:
    - location: .github/scripts/after_install.sh
      timeout: 300
  ApplicationStart:
    - location: .github/scripts/app_start.sh
      timeout: 60
  AfterAllowTraffic:
    - location: .github/scripts/after_allow_traffic.sh
      timeout: 300
