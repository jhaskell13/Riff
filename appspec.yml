version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/laravel
    overwrite: true

hooks:
  AfterInstall:
    - location: code-deploy/scripts/after_install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: code-deploy/scripts/application_start.sh
      timeout: 300
      runas: root
