name: Deploy Laravel to EC2 via CodeDeploy

on:
  # workflow_dispatch:
  #   inputs:
  #     checkout-target:
  #       description: 'Branch to deploy'
  #       required: true
  #       default: main
  #     environment:
  #       type: choice
  #       description: 'Environment to deploy to'
  #       required: true
  #       default: 'production'
  #       options:
  #         - production
  #         - staging

  push:
    branches: [ "main" ]

permissions:
  contents: read

# Two pushes in quick succession must not race each other onto the box;
# the newer one waits for the older to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Fetch CodeDeploy variables
      run: |
        ENVIRONMENT="production"
        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV

        APP=$(aws ssm get-parameter \
          --name "/$ENVIRONMENT/codedeploy/app_name" \
          --query "Parameter.Value" \
          --output text)
        GROUP=$(aws ssm get-parameter \
          --name "/$ENVIRONMENT/codedeploy/deployment_group_name" \
          --query "Parameter.Value" \
          --output text)
        BUCKET=$(aws ssm get-parameter \
          --name "/$ENVIRONMENT/s3/bucket_name" \
          --query "Parameter.Value" \
          --output text)

        echo "APP=$APP" >> $GITHUB_ENV
        echo "GROUP=$GROUP" >> $GITHUB_ENV
        echo "BUCKET=$BUCKET" >> $GITHUB_ENV

    # The same pinned PHP the CI jobs use, not whatever apt ships today.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, curl, zip, bcmath, pdo, pdo_mysql, pdo_pgsql, gd
        coverage: none

    - name: Install PHP dependencies
      run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Build assets
      run: |
        npm ci
        npm run build

    # Ship only what production runs: no VCS, tests, CI config, or node
    # modules. The bundle name carries the commit, so S3 keeps an artifact
    # per release and a rollback is a redeploy of an old key.
    - name: Zip source
      run: |
        zip -r "release-${GITHUB_SHA}.zip" . \
          -x "*.git*" "node_modules/*" "tests/*" ".github/*" \
             "storage/logs/*" "storage/framework/cache/*" \
             "storage/framework/sessions/*" "storage/framework/views/*"

    - name: Upload to S3
      run: aws s3 cp "release-${GITHUB_SHA}.zip" "s3://$BUCKET/releases/release-${GITHUB_SHA}.zip"

    - name: Trigger CodeDeploy
      run: |
        DEPLOYMENT_ID=$(aws deploy create-deployment \
          --application-name "$APP" \
          --deployment-group-name "$GROUP" \
          --s3-location bucket="$BUCKET",bundleType=zip,key="releases/release-${GITHUB_SHA}.zip" \
          --query deploymentId --output text)
        echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV
        echo "Started deployment $DEPLOYMENT_ID"

    # A deploy that fails on the box must fail the workflow, not sit green
    # while production runs the old release.
    - name: Wait for CodeDeploy to finish
      run: aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
