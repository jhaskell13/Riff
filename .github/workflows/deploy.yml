name: Deploy Laravel to EC2 via CodeDeploy

on:
  # workflow_dispatch:
  #   inputs:
  #     checkout-target:
  #       description: 'Branch to deploy'
  #       required: true
  #       default: main
  #     environment:
  #       type: choice
  #       description: 'Environment to deploy to'
  #       required: true
  #       default: 'staging'
  #       options:
  #         - production
  #         - staging

  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Fetch CodeDeploy variables
      run: |
        ENVIRONMENT=${{ inputs.environment }}
        APP=$(aws ssm get-parameter \
          --name "/$ENVIRONMENT/codedeploy/app_name" \
          --query "Parameter.Value" \
          --output text)
        GROUP=$(aws ssm get-parameter \
          --name "/$ENVIRONMENT/codedeploy/deployment_group_name" \
          --query "Parameter.Value" \
          --output text)
        BUCKET=$(aws ssm get-parameter \
          --name "/$ENVIRONMENT/s3/bucket_name" \
          --query "Parameter.Value" \
          --output text)

        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
        echo "APP=$APP" >> $GITHUB_ENV
        echo "GROUP=$GROUP" >> $GITHUB_ENV
        echo "BUCKET=$BUCKET" >> $GITHUB_ENV


    # Install PHP and Node build dependencies
    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y php-cli php-mbstring php-xml php-curl php-zip unzip php-bcmath php-pdo php-mysqlnd php-pgsql php-json php-fpm
        composer install --no-dev --prefer-dist --optimize-autoloader

    - name: Setup Node
      uses: actions/setup-node@v3

    # Install Node dependencies & build assets
    - name: Build assets
      run: |
        npm ci
        npm run build

    - name: Zip source
      run: zip -r release.zip . -x "*.git*" "node_modules/*" "tests/*" "vendor/*"

    - name: Upload to S3
      run: aws s3 cp release.zip s3://$BUCKET/releases/release.zip

    - name: Trigger CodeDeploy
      run: |
        aws deploy create-deployment \
          --application-name "$APP" \
          --deployment-group-name "$GROUP" \
          --s3-location bucket="$BUCKET",bundleType=zip,key=releases/release.zip
